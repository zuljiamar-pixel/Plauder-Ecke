    b.disabled = !current || (sending && !mic) || (!mic && !has);
  }
  function setTyping(on){ setPresence({ typing: on }); }

  $('text').addEventListener('input', () => {
    autosize(); updateSend(); if (current) store.set('draft:' + current, $('text').value);
    setTyping(!!$('text').value.trim());
    clearTimeout(typingTimer); typingTimer = setTimeout(() => setTyping(false), 3000);
  });
  $('text').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && !matchMedia('(pointer: coarse)').matches){ e.preventDefault(); $('compose').requestSubmit(); }
  });
  $('text').addEventListener('paste', e => {
    const files = [...(e.clipboardData?.files || [])].filter(f => f.type.startsWith('image/') || f.type.startsWith('video/'));
    if (files.length){ e.preventDefault(); addFiles(files); }
  });
  $('cam-btn').hidden = !matchMedia('(pointer: coarse)').matches;
  $('cam-btn').onclick = () => $('cam-input').click();
  $('gal-btn').onclick = () => $('gal-input').click();
  for (const id of ['cam-input', 'gal-input']) $(id).addEventListener('change', e => { addFiles([...e.target.files]); e.target.value = ''; });
  const main = document.querySelector('.main');
  main.addEventListener('dragover', e => { if (e.dataTransfer?.types.includes('Files')){ e.preventDefault(); main.classList.add('drop'); } });
  main.addEventListener('dragleave', e => { if (!main.contains(e.relatedTarget)) main.classList.remove('drop'); });
  main.addEventListener('drop', e => { main.classList.remove('drop'); if (e.dataTransfer?.files.length){ e.preventDefault(); addFiles([...e.dataTransfer.files]); } });

  $('compose').addEventListener('submit', async e => {
    e.preventDefault();
    if (rec.state !== 'idle') return;
    const box = $('text'), text = box.value.trim(), items = pending.slice(), gid = current;
    if ((!text && !items.length) || !gid || sending) return;
    if (items.some(p => p.kind === 'video' && !p.ready)){ toast('Das Video lädt noch. Einen Moment.'); return; }
    unlockVideos(items);
    sending = true; setTyping(false);
    box.value = ''; store.set('draft:' + gid, ''); autosize();
    renderTray(); updateSend();
    const images = items.filter(p => p.kind === 'image'), videos = items.filter(p => p.kind === 'video');
    let paths = [], textSent = false;
    try {
      // Each video becomes its own message; the text rides along with the pictures, or with the last video
      for (const [i, p] of videos.entries()){
        const caption = !images.length && i === videos.length - 1 ? text : '';
        const progress = pct => {
          const label = `${Math.round(pct * 100)} %`;
          if (p.progEl) p.progEl.textContent = label;
          $('status').textContent = `Video wird verkleinert … ${label}`;
        };
        paths = [];
        $('status').textContent = 'Video wird vorbereitet …';
        const vid = await videoForUpload(p, progress);
        $('status').textContent = 'Video wird gesendet …';
        const path = await upload(gid, vid.blob, vid.ext, vid.type); paths.push(path);
        let poster = null;
        if (p.poster){ try { poster = await upload(gid, p.poster, 'jpg', 'image/jpeg'); paths.push(poster); } catch {} }
        await insertMessage(gid, { kind: 'video', text: caption, media: { path, poster, dur: Math.round((vid.dur || 0) * 10) / 10, w: vid.w, h: vid.h } });
        paths = []; if (caption) textSent = true;
        pending = pending.filter(q => q !== p); dropItem(p); renderTray();
      }
      if (images.length || (text && !textSent)){
        if (images.length) $('status').textContent = images.length === 1 ? 'Bild wird gesendet …' : `${images.length} Bilder werden gesendet …`;
        for (const p of images){
          const blob = await shrink(p.file);
          const type = blob.type || 'image/jpeg';
          paths.push(await upload(gid, blob, extOf(type), type));
        }
        await insertMessage(gid, images.length ? { kind: 'image', text, media: { paths } } : { kind: 'text', text });
        paths = []; textSent = true;
        pending = pending.filter(q => !images.includes(q)); images.forEach(dropItem);
      }
    } catch (err){
      if (paths.length) sb.storage.from('media').remove(paths).catch(() => {});
      if (current === gid && text && !textSent && !box.value){ box.value = text; autosize(); }
      toast(errText(err, 'Senden hat nicht geklappt. Deine Nachricht ist noch da.'));
    } finally {
      sending = false; renderTray(); updateSend(); renderPeople();
    }
  });

  // ---------- New group, invite sheet, name, leaving ----------
  $('newgroup-name').addEventListener('input', () => $('newgroup-btn').disabled = !$('newgroup-name').value.trim());
  $('newgroup').addEventListener('submit', async e => {
    e.preventDefault();
    const name = $('newgroup-name').value.trim();
    if (!name || !sb) return;
    $('newgroup-btn').disabled = true;
    const id = await createGroup(name);
    if (!id) return;
    $('newgroup-name').value = '';
    renderGroups(); await openGroup(id); openSheet();
  });

  function openSheet(){
    const g = groups.get(current); if (!g) return;
    $('sheet-title').textContent = 'Freunde einladen';
    $('sheet-text').textContent = `Schick diesen Link an deine Freunde. Wer ihn öffnet, kann „${g.name}“ beitreten.`;
    $('invite-link').value = inviteLink(g);
    $('share-btn').hidden = !navigator.share;
    $('my-name').value = myName;
    const leave = $('leave-btn'); leave.classList.remove('armed'); leave.textContent = 'Gruppe verlassen';
    $('sheet').hidden = false;
  }
  const closeSheet = () => { $('sheet').hidden = true; };
  $('invite-btn').onclick = openSheet;
  $('sheet-close').onclick = closeSheet;
  $('sheet').addEventListener('click', e => { if (e.target === $('sheet')) closeSheet(); });
  $('share-btn').onclick = async () => {
    const g = groups.get(current); if (!g) return;
    try { await navigator.share({ title: 'Plauderecke', text: `Komm in meine Gruppe „${g.name}“ auf Plauderecke:`, url: $('invite-link').value }); } catch {}
  };
  $('copy-btn').onclick = async () => {
    const box = $('invite-link');
    try { await navigator.clipboard.writeText(box.value); toast('Link kopiert. Füg ihn in WhatsApp oder so ein.'); }
    catch { box.focus(); box.select(); toast('Markiert. Jetzt einfach kopieren.'); }
  };
  $('name-form').addEventListener('submit', async e => {
    e.preventDefault();
    const name = $('my-name').value.trim().slice(0, 30);
    if (!name || name === myName) return;
    const { error } = await sb.from('members').update({ name }).eq('user_id', me);
    if (error){ toast('Der Name konnte nicht gespeichert werden.'); return; }
    myName = name; store.set('name', name);
    for (const gid of groups.keys()) names.set(gid + ':' + me, name);
    setPresence({}); if (room) Promise.resolve(room.track({ name: myName, ...presenceState })).catch(() => {});
    renderLog(); renderPeople(); toast('Name gespeichert.');
  });
  $('leave-btn').onclick = async () => {
    const btn = $('leave-btn'), gid = current;
    if (!btn.classList.contains('armed')){ btn.classList.add('armed'); btn.textContent = 'Wirklich verlassen?'; return; }
    const { error } = await sb.from('members').delete().eq('group_id', gid).eq('user_id', me);
    if (error){ toast('Verlassen hat nicht geklappt.'); return; }
    closeSheet();
    groups.delete(gid); unread.delete(gid);
    if (groups.size){ renderGroups(); await openGroup([...groups.keys()][0]); }
    else location.reload();
  };

  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (!lb.hidden) closeLightbox();
    if (!$('sheet').hidden) closeSheet();
  });
  // A second invite link opened in the same tab
  window.addEventListener('hashchange', async () => {
    const h = new URLSearchParams(location.hash.slice(1)), code = h.get('join');
    if (!code || !sb || !me || !myName) return;
    try { history.replaceState(null, '', location.pathname + location.search); } catch {}
    const id = await joinGroup(code);
    if (id){ await loadGroups(); await openGroup(id); }
  });

  $('log').innerHTML = LOADING;
  updateSend();
  boot().catch(async err => {
    console.error(err);
    await ask({ title: 'Etwas ist schiefgelaufen', text: 'Lade die Seite neu. Wenn das immer wieder passiert, prüf, ob du setup.sql in Supabase ausgeführt hast.', button: 'Neu laden' });
    location.reload();
  });
})();
</script>
</body>
</html>
